<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        ============================================================
        Finger-Drums  •  Dub-Techno Edition  •  All-in-one HTML/CSS/JS
        ------------------------------------------------------------
        CHANGES in this version
        • “Sample Deck” – a dedicated pad that always plays the *latest*
          imported sample (handy for quick one-shot stabs or vocal cuts).
        • 12 Pads total (4×3 grid) – added Ride, Cowbell, Bell, and a
          dub-techno Chord stab (band-limited detuned saws through a
          resonant filter) to give classic warehouse flavour.
        • Hover-to-play remains; right-click still re-maps any pad
          (except the Sample Deck) to a custom sample.
        • Recording logic confirmed: every take is stored in `layers[]`
          and loops correctly.
        • All code lives in *this* file – open it locally or serve it
          from any web server.
        ============================================================
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Finger-Drums – Dub Techno Edition</title>

    <!-- =========================  CSS  ========================= -->
    <style>
        /* ----------  Root theme palette  ---------- */
        :root{
            --bg1:#10121A;        /* overall background            */
            --bg2:#1B1E29;        /* pad background (idle)         */
            --accent:#14F195;     /* neon accent                   */
            --accent-dim:#0da86a; /* dim accent                    */
            --text:#E8EAF6;       /* foreground text               */
            --danger:#FF4E6D;     /* record button                 */
            --danger-dim:#c23a53;
            font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
        }
        html,body{
            margin:0;
            height:100%;
            display:flex;
            flex-direction:column;
            background:var(--bg1);
            color:var(--text);
        }

        /* ----------  Layout wrappers  ---------- */
        .wrapper{
            max-width:960px;
            margin:auto;
            padding:1rem;
            width:100%;
            display:flex;
            flex-direction:column;
            gap:1.6rem;
        }
        h1{
            margin:0;
            text-align:center;
            font-size:2rem;
            font-weight:700;
            color:var(--accent);
            letter-spacing:.04em;
        }

        /* ----------  Pad grid  ---------- */
        .pad-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr); /* 4×3 = 12 pads */
            gap:1rem;
        }
        @media(max-width:640px){
            .pad-grid{grid-template-columns:repeat(3,1fr);}
        }

        /* ----------  Pads  ---------- */
        .pad{
            background:var(--bg2);
            border:none;
            border-radius:12px;
            aspect-ratio:1/1;
            color:var(--text);
            cursor:pointer;
            position:relative;
            box-shadow:0 0 0 2px var(--bg2),0 0 12px #000 inset;
            transition:all .12s ease;
            user-select:none;
        }
        .pad:before{
            content:'';
            position:absolute; inset:0;
            border-radius:inherit;
            background:var(--accent-dim);
            opacity:0;
            filter:blur(16px);
            transition:opacity .12s ease;
            pointer-events:none;
        }
        .pad:hover{transform:translateY(-2px);}
        .pad:hover:before{opacity:.35;}
        .pad.active{
            transform:translateY(0) scale(.97);
            box-shadow:0 0 0 2px var(--accent),0 0 20px var(--accent);
        }
        .pad.active:before{opacity:.7;}

        /* pad caption */
        .pad span{
            position:absolute;
            bottom:8px; right:10px;
            font-size:.75rem;
            opacity:.7;
            pointer-events:none;
        }

        /* ----------  Sample Deck  ---------- */
        .deck-container{
            display:flex;
            align-items:center;
            gap:1rem;
            flex-wrap:wrap;
        }
        .deck-container .pad{
            aspect-ratio:1/1;      /* same size as grid pads */
        }
        .deck-info{
            display:flex;
            flex-direction:column;
            gap:.4rem;
            font-size:.85rem;
        }

        /* ----------  Control bar  ---------- */
        .controls{
            display:flex;
            flex-wrap:wrap;
            gap:1rem;
            align-items:center;
            justify-content:space-evenly;
        }
        .btn{
            padding:.6rem 1.4rem;
            border:none;
            border-radius:8px;
            font-size:.9rem;
            cursor:pointer;
            background:var(--accent);
            color:#002a14;
            font-weight:600;
            transition:background .15s ease;
        }
        .btn:hover{background:var(--accent-dim);}
        .btn:disabled{opacity:.4;pointer-events:none;}

        .btn-record{background:var(--danger);}
        .btn-record:hover{background:var(--danger-dim);}

        .slider-container{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:.3rem;
            font-size:.8rem;
        }
        input[type=range]{accent-color:var(--accent);}
    </style>
</head>

<body>
<div class="wrapper">
    <h1>🎛️ Finger-Drums – Dub Techno Edition</h1>

    <!-- =================== 12-Pad Grid =================== -->
    <div id="padGrid" class="pad-grid">
        <button class="pad" data-sound="kick"    ><span>Kick</span></button>
        <button class="pad" data-sound="snare"   ><span>Snare</span></button>
        <button class="pad" data-sound="hihat"   ><span>Hi-Hat</span></button>
        <button class="pad" data-sound="ride"    ><span>Ride</span></button>
        <button class="pad" data-sound="clap"    ><span>Clap</span></button>
        <button class="pad" data-sound="cowbell" ><span>Cowbell</span></button>
        <button class="pad" data-sound="tomLow"  ><span>Tom L</span></button>
        <button class="pad" data-sound="tomMid"  ><span>Tom M</span></button>
        <button class="pad" data-sound="tomHi"   ><span>Tom H</span></button>
        <button class="pad" data-sound="bell"    ><span>Bell</span></button>
        <button class="pad" data-sound="perc"    ><span>Fx</span></button>
        <button class="pad" data-sound="chord"   ><span>Chord</span></button>
    </div>

    <!-- =================== Sample Deck =================== -->
    <div class="deck-container">
        <button id="deckPad" class="pad" data-sound="deck" disabled><span>Deck</span></button>
        <div class="deck-info">
            <button id="btnLoadDeck" class="btn">📂 Load Deck Sample</button>
            <span id="deckLabel">No sample loaded</span>
        </div>
    </div>

    <!-- =================== Transport / FX =================== -->
    <div class="controls">
        <button id="btnPlay"    class="btn">▶️ Play</button>
        <button id="btnStop"    class="btn">⏹️ Stop</button>
        <button id="btnRecord"  class="btn btn-record">● Record</button>
        <button id="btnOverdub" class="btn">➕ Overdub</button>
        <button id="btnClear"   class="btn">🧹 Clear Loops</button>

        <div class="slider-container">
            <label for="tempo">Tempo (<span id="tempoVal">120</span> BPM)</label>
            <input type="range" id="tempo" min="60" max="200" value="120">
        </div>
        <div class="slider-container">
            <label for="echo">Echo (<span id="echoVal">0</span> ms)</label>
            <input type="range" id="echo" min="0" max="600" value="0">
        </div>

        <!-- shared hidden file input -->
        <input type="file" id="fileInput" accept="audio/*" hidden>
        <button id="btnSample" class="btn">🎙️ Map Sample to Pad</button>
    </div>
</div>

<!-- =========================  JavaScript  ========================= -->
<script>
/* ------------------------------------------------------------------ *
   SECTION 1 – Web-Audio Set-up
   ------------------------------------------------------------------ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioCtx();

/* ------------------------------------------------------------------ *
   SECTION 2 – Global transport & state
   ------------------------------------------------------------------ */
let tempo       = 120;          // BPM
const PPQ       = 4;            // pulses per quarter
const barLength = 4;            // bars per loop
let isPlaying   = false;
let isRecording = false;
let startTime   = 0;
let nextNoteTime= 0;
let schedID;
const scheduleAhead = 0.1;      // seconds
const layers = [];              // recorded takes
let currentTake=[];

/* ------------------------------------------------------------------ *
   SECTION 3 – Master gain & Echo
   ------------------------------------------------------------------ */
const masterGain = ctx.createGain();
masterGain.gain.value = 1;
masterGain.connect(ctx.destination);

const delay = ctx.createDelay(1.0);
const fbGain = ctx.createGain(); fbGain.gain.value = 0;
delay.connect(fbGain).connect(delay);
delay.connect(masterGain);

/* ------------------------------------------------------------------ *
   SECTION 4 – Drum Synths + Dub Techno Extras
   ------------------------------------------------------------------ */
const DrumSynth = {
    /* Kick – sine drop */
    kick(t=ctx.currentTime){
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.setValueAtTime(120,t);
        o.frequency.exponentialRampToValueAtTime(50,t+0.15);
        g.gain.setValueAtTime(1,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
        o.connect(g).connect(delay); o.start(t); o.stop(t+0.18);
    },
    /* Snare – noise burst + tone */
    snare(t=ctx.currentTime){
        noiseBurst(t,0.2,1800,0.17);
        toneBurst(t,200,0.12,0.7);
    },
    /* Hi-Hat – high-passed noise */
    hihat(t=ctx.currentTime){ noiseBurst(t,0.07,8000,0.06,7000); },
    /* Ride – longer bright noise */
    ride(t=ctx.currentTime){ noiseBurst(t,0.4,10000,0.35,9000); },
    /* Clap – 3 fast snare-likes */
    clap(t=ctx.currentTime){ for(let i=0;i<3;i++) this.snare(t+i*0.015); },
    /* Cowbell – two square waves */
    cowbell(t=ctx.currentTime){
        bellTone(t,640,0.15,0.8,'square');
        bellTone(t,845,0.15,0.8,'square');
    },
    /* Bells – FM style metallic ding */
    bell(t=ctx.currentTime){
        bellTone(t,880,1.2,0.7);
        bellTone(t,1320,1.1,0.5);
    },
    /* Perc FX – down-swept noise */
    perc(t=ctx.currentTime){
        const buf=ctx.createBuffer(1,ctx.sampleRate*0.4,ctx.sampleRate);
        const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
        const s=ctx.createBufferSource(); s.buffer=buf;
        const lp=ctx.createBiquadFilter(); lp.type='lowpass';
        lp.frequency.setValueAtTime(8000,t);
        lp.frequency.exponentialRampToValueAtTime(300,t+0.4);
        const g=ctx.createGain(); g.gain.setValueAtTime(1,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
        s.connect(lp).connect(g).connect(delay);
        s.start(t); s.stop(t+0.4);
    },
    /* Low, Mid, Hi toms */
    tomLow:t=>DrumSynth.tom(110,t),
    tomMid:t=>DrumSynth.tom(165,t),
    tomHi :t=>DrumSynth.tom(220,t),
    tom(freq,t=ctx.currentTime){
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.setValueAtTime(freq,t);
        o.frequency.exponentialRampToValueAtTime(freq*0.7,t+0.26);
        g.gain.setValueAtTime(1,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.26);
        o.connect(g).connect(delay); o.start(t); o.stop(t+0.3);
    },
    /* Chord – classic dub-techno stab (band-limited saws) */
    chord(t=ctx.currentTime){
        const root=220;            // A3 – detuned triad
        const freqs=[root, root*1.25, root*1.5];
        const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8;
        const g=ctx.createGain();
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.7,t+0.01);   // fast attack
        g.gain.exponentialRampToValueAtTime(0.001,t+1.2); // dub decay
        freqs.forEach(f=>{
            const o=ctx.createOscillator();
            o.type='sawtooth';
            o.frequency.value=f;
            const detune=(Math.random()*2-1)*3;  // ±3 cents random
            o.detune.value=detune;
            o.connect(bp);
            o.start(t);
            o.stop(t+1.3);
        });
        bp.connect(g).connect(delay);
    }
};

/* ---------- helper tonal/noise builders ---------- */
function noiseBurst(t,len,peakFreq,dur,filterFreq=peakFreq){
    const buf=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filterFreq;
    const g=ctx.createGain(); g.gain.setValueAtTime(1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f).connect(g).connect(delay); s.start(t); s.stop(t+dur);
}
function toneBurst(t,freq,len,amp,type='sine'){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(amp,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+len);
    o.connect(g).connect(delay); o.start(t); o.stop(t+len);
}
function bellTone(t,freq,len,amp,type='sine'){ toneBurst(t,freq,len,amp,type); }

/* ------------------------------------------------------------------ *
   SECTION 5 – Pad interaction (hover-to-play)
   ------------------------------------------------------------------ */
const padGrid=document.getElementById('padGrid');
padGrid.addEventListener('pointerover',e=>{
    const pad=e.target.closest('.pad'); if(!pad) return;
    triggerPad(pad);
});
/* Sample Deck hover */
const deckPad=document.getElementById('deckPad');
deckPad.addEventListener('pointerover',()=> triggerPad(deckPad));

function triggerPad(pad){
    const type=pad.dataset.sound;
    playSound(type);
    if(isRecording) recordEvent(type);
    pad.classList.add('active');
    setTimeout(()=>pad.classList.remove('active'),100);
}

const customSamples={};    // {soundType:fn}

/* Master play router */
function playSound(type,t=ctx.currentTime){
    (customSamples[type] || DrumSynth[type] || (()=>{}))(t);
}

/* ------------------------------------------------------------------ *
   SECTION 6 – Recording
   ------------------------------------------------------------------ */
function recordEvent(type){
    const beatDur=60/tempo/PPQ;
    const idx=Math.round((ctx.currentTime-startTime)/beatDur);
    currentTake.push({beatIndex:idx,type});
}
function startRecording(){
    currentTake=[]; isRecording=true; recUI(true);
    if(!isPlaying) startTransport();
}
function stopRecording(){
    isRecording=false; recUI(false);
    if(currentTake.length) layers.push(currentTake);
    currentTake=[];
}
function recUI(state){
    const btn=document.getElementById('btnRecord');
    btn.textContent=state?'⏸️ Rec':'● Record';
}

/* ------------------------------------------------------------------ *
   SECTION 7 – Transport scheduler
   ------------------------------------------------------------------ */
function startTransport(){
    if(ctx.state==='suspended') ctx.resume();
    startTime=ctx.currentTime; nextNoteTime=startTime+0.05;
    isPlaying=true;
    schedID=setInterval(scheduler,25);
}
function stopTransport(){
    isPlaying=false; clearInterval(schedID);
}
function scheduler(){
    const beatDur=60/tempo/PPQ;
    while(nextNoteTime<ctx.currentTime+scheduleAhead){
        const step=Math.round((nextNoteTime-startTime)/beatDur);
        layers.forEach(take=>{
            take.filter(ev=>ev.beatIndex%(barLength*PPQ)===step%(barLength*PPQ))
                .forEach(ev=>playSound(ev.type,nextNoteTime));
        });
        nextNoteTime+=beatDur;
    }
}

/* ------------------------------------------------------------------ *
   SECTION 8 – UI Buttons / Sliders
   ------------------------------------------------------------------ */
qs('#btnPlay'   ).onclick=()=>{ if(!isPlaying) startTransport(); };
qs('#btnStop'   ).onclick= stopTransport;
qs('#btnRecord' ).onclick=()=> isRecording ? stopRecording() : startRecording();
qs('#btnOverdub').onclick=()=>{ if(!isPlaying) startTransport(); isRecording=true; recUI(true); };
qs('#btnClear'  ).onclick=()=> layers.length=0;

qs('#tempo').oninput=e=>{
    tempo=+e.target.value; qs('#tempoVal').textContent=tempo;
};
qs('#echo').oninput=e=>{
    const v=+e.target.value; qs('#echoVal').textContent=v;
    delay.delayTime.value=v/1000; fbGain.gain.value=v?0.4:0;
};

/* ------------------------------------------------------------------ *
   SECTION 9 – Sample mapping and Sample Deck
   ------------------------------------------------------------------ */
let armedPad=null;
padGrid.addEventListener('contextmenu',e=>{
    const pad=e.target.closest('.pad'); if(!pad || pad===deckPad) return;
    e.preventDefault();
    armedPad=pad;
    [...padGrid.children].forEach(p=>p.classList.remove('armed'));
    pad.classList.add('armed');
});
qs('#btnSample').onclick=()=>{
    if(!armedPad) return alert('Right-click a pad first to choose target.');
    qs('#fileInput').click();
};
/* Deck loader */
qs('#btnLoadDeck').onclick=()=> qs('#fileInput').click();

/* Shared file handler */
qs('#fileInput').onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    const buf=await file.arrayBuffer();
    const audio=await ctx.decodeAudioData(buf);
    if(armedPad){
        mapSampleToPad(armedPad.dataset.sound,audio);
        armedPad.querySelector('span').textContent='Sample';
        armedPad.classList.remove('armed'); armedPad=null;
    }else{
        mapSampleToPad('deck',audio);
        deckPad.disabled=false;
        qs('#deckLabel').textContent=file.name;
    }
};
/* helper */
function mapSampleToPad(type,audioBuf){
    customSamples[type]=t=>{
        const s=ctx.createBufferSource(); s.buffer=audioBuf;
        s.connect(delay); s.start(t);
    };
}

/* ------------------------------------------------------------------ *
   UTIL
   ------------------------------------------------------------------ */
function qs(sel){return document.querySelector(sel);}
</script>
</body>
</html>
