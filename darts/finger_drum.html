<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ──────────────────────────────────────────────────────────────
         FINGER-DRUMS – DUB TECHNO EDITION
         -------------------------------------------------------------
         This single-page application is a *self-contained* browser
         instrument aimed at live “finger-drumming” of *dub-techno*
         grooves.  All HTML, CSS, and JavaScript are in this file so
         you can simply drop it onto a web-server *or* double-click it.

         MAJOR FEATURES
         • 4×4 pad grid (16 pads) – drums, chords, bass, noise, FX.
         • Pads trigger on **hover** (pointer-over) for ultra-fast play.
         • Built-in tape-style *feedback delay* with darkening repeats.
         • Spring-style *reverb* (generated impulse) after the delay.
         • Global *drive* / saturation for analog warmth.
         • Master *filter* (low-pass) for Sweeps + LFO wobble on chords.
         • *Side-chain ducking* – kick ducks chords/noise for groove.
         • Sliders / knobs for tempo, delay time, feedback, reverb mix,
           filter cutoff, drive, and ducking amount.
         • Right-click a pad → map any user sample (one-shot).
         • “Deck” pad always plays the *latest* imported sample.
         • Simple 4-bar looper with overdub – press **Record** then jam.
         • Fully commented – beginner-friendly explanations throughout.
         • No external libraries – 100 % Web-Audio API (zero deps).
         ─────────────────────────────────────────────────────────── -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Finger-Drums - Dub Techno Edition</title>

    <!-- ─────  VISUAL THEME / LAYOUT  ───── -->
    <style>
        /* --------  global colour palette (easy re-skin)  -------- */
        :root{
            --bg1:#0E1016;            /* dark backdrop                */
            --bg2:#1B1E29;            /* idle pad fill                */
            --accent:#12EABF;         /* neon accent                  */
            --accent-dim:#0a967b;     /* dimmer accent                */
            --text:#E8EAF6;           /* foreground text              */
            --danger:#FF4E6D;         /* record button colour         */
            --danger-dim:#c23a53;
            font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }
        /* --------  page reset + flex column  -------- */
        html,body{
            margin:0;
            height:100%;
            display:flex;
            flex-direction:column;
            background:var(--bg1);
            color:var(--text);
        }
        h1{
            margin:0;
            text-align:center;
            font-size:2.2rem;
            font-weight:700;
            letter-spacing:.04em;
            color:var(--accent);
        }

        /* --------  wrapper constrains width  -------- */
        .wrapper{
            max-width:1000px;
            width:100%;
            margin:auto;
            padding:1rem;
            display:flex;
            flex-direction:column;
            gap:1.6rem;
        }

        /* --------  4×4 pad grid  -------- */
        .pad-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:1rem;
        }
        @media(max-width:640px){ .pad-grid{grid-template-columns:repeat(3,1fr);} }

        /* --------  pad aesthetics  -------- */
        .pad{
            position:relative;
            border:none;
            border-radius:12px;
            aspect-ratio:1/1;      /* perfect square */
            background:var(--bg2);
            box-shadow:0 0 0 2px var(--bg2),0 0 12px #000 inset;
            color:var(--text);
            cursor:pointer;
            transition:transform .12s ease;
            user-select:none;
        }
        /* glow element – appears on hover / active */
        .pad::before{
            content:'';
            position:absolute; inset:0;
            background:var(--accent-dim);
            border-radius:inherit;
            filter:blur(16px);
            opacity:0;
            transition:opacity .12s ease;
            pointer-events:none;
        }
        .pad:hover            {transform:translateY(-2px);}
        .pad:hover::before    {opacity:.35;}
        .pad.active{
            transform:scale(.97);
            box-shadow:0 0 0 2px var(--accent),0 0 24px var(--accent);
        }
        .pad.active::before{opacity:.8;}
        /* pad label */
        .pad span{
            position:absolute; bottom:8px; right:10px;
            font-size:.72rem; pointer-events:none; opacity:.8;
        }

        /* --------  controls  -------- */
        .controls{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            justify-content:space-evenly;
            gap:1rem;
        }
        .btn{
            padding:.6rem 1.4rem;
            border:none; border-radius:8px;
            font-size:.9rem; font-weight:600;
            background:var(--accent); color:#002d22;
            cursor:pointer; transition:.15s background;
        }
        .btn:hover{background:var(--accent-dim);}
        .btn:disabled{opacity:.4;pointer-events:none;}

        .btn-record{background:var(--danger);}
        .btn-record:hover{background:var(--danger-dim);}

        /* slider + tiny label wrapper */
        .slider-wrap{
            display:flex; flex-direction:column; align-items:center;
            font-size:.8rem; gap:.3rem;
        }
        input[type=range]{accent-color:var(--accent); width:110px;}

        /* knob – circular range styled with CSS only (for drive) */
        .knob{
            appearance:none;
            width:54px; height:54px;
            border-radius:50%;
            background:conic-gradient(var(--accent) calc(var(--val,0)*1%),#555 0);
            position:relative; cursor:pointer;
        }
        .knob::after{
            content:''; position:absolute; inset:10px;
            border-radius:50%; background:#111;
        }

        /* armed pad outline (for mapping) */
        .armed{outline:2px dashed var(--accent); outline-offset:3px;}
    </style>
</head>
<body>
<div class="wrapper">
    <h1>🎚️ Dub Techno Groove-Box</h1>

    <!-- ────── 16-Pad performance grid ────── -->
    <div id="padGrid" class="pad-grid">
        <!-- row 1 – drums -->

        <button class="pad" data-sound="clhat"  ><span>Hat C</span></button>

    <!-- ────── Transport + FX controls ────── -->
    <div class="controls">

        <!-- transport buttons -->
        <button id="btnPlay"    class="btn">▶️ Play</button>
        <button id="btnStop"    class="btn">⏹️ Stop</button>
        <button id="btnRecord"  class="btn btn-record">● Record</button>

        <button id="btnClear"   class="btn">🧹 Clear</button>

        <!-- tempo -->
        <div class="slider-wrap">
            <label for="tempo">Tempo (<span id="tempoVal">120</span> BPM)</label>
            <input type="range" id="tempo" min="60" max="200" value="120">
        </div>

        <!-- delay time -->
        <div class="slider-wrap">
            <label for="delayTime">Delay Time (<span id="dTimeVal">300</span> ms)</label>
            <input type="range" id="delayTime" min="100" max="900" value="300">
        </div>

        <!-- delay feedback -->
        <div class="slider-wrap">
            <label for="feedback">Feedback (<span id="fbVal">0.40</span>)</label>

        <!-- chord filter cutoff -->
        <div class="slider-wrap">
            <label for="cutoff">Chord LPF (<span id="cutVal">1400</span> Hz)</label>
            <input type="range" id="cutoff" min="400" max="6000" value="1400">
        </div>

        <!-- drive knob (circular) -->
        <div class="slider-wrap">
            <label for="driveKnob">Drive</label>
            <input id="driveKnob" type="range" min="0" max="1" step="0.02" value="0" class="knob">
        </div>

        <!-- duck amount -->
        <div class="slider-wrap">
            <label for="duckAmt">Duck (<span id="duckVal">0.6</span>)</label>
            <input type="range" id="duckAmt" min="0" max="1" step="0.05" value="0.6">
        </div>

        <!-- sample loader -->
        <input type="file" id="fileInput" accept="audio/*" hidden>
        <button id="btnSample" class="btn">🎙️ Load Sample</button>
    </div>
</div>

<!-- ──────────────────────────────────────────────────────────────
     √  EVERYTHING AUDIO HAPPENS BELOW THIS LINE
     ──────────────────────────────────────────────────────────── -->
<script>
/*-----------------------------------------------------------------
SECTION 0 –  HELPER FUNCTIONS
-----------------------------------------------------------------*/
/** Sigmoid soft-clip curve for gentle saturation. */
function makeSaturationCurve(amount=0.5, samples=44100){
    /* amount 0→1 → how hard the curve bends */
    const k = amount*20 + 1;
    const curve = new Float32Array(samples);
    for(let i=0;i<samples;i++){
        const x = (i*2/samples)-1;
        curve[i] = ((1+k)*x)/(1+k*Math.abs(x));
    }
    return curve;
}

/** Utility shortcut: querySelector */
const $ = sel => document.querySelector(sel);

/*-----------------------------------------------------------------
SECTION 1 –  AUDIO CONTEXT & MASTER CHAIN
-----------------------------------------------------------------*/
const AudioCtx = window.AudioContext||window.webkitAudioContext;
const ctx = new AudioCtx();

/*── Final safety-compressor / limiter to avoid clipping ──*/
const limiter = ctx.createDynamicsCompressor();
limiter.threshold.value=-6; limiter.ratio.value=12; limiter.knee.value=0;
limiter.connect(ctx.destination);

/*── Master drive (waveshaper) then output to limiter ──*/
const drive = ctx.createWaveShaper();
drive.curve = makeSaturationCurve(0);
drive.oversample='4x';
drive.connect(limiter);

/*-----------------------------------------------------------------
SECTION 2 –  GLOBAL BUSES  (drum / chord / bass / perc / noise)
-----------------------------------------------------------------*/
const drumBus  = ctx.createGain().connect(drive);
const chordBus = ctx.createGain();             // goes through duckGain
const bassBus  = ctx.createGain().connect(drive);
const percBus  = ctx.createGain();             // small group for misc
const noiseBus = ctx.createGain();             // atmosphere / hiss

/* Ducking gain: chord + noise feed through this so kick can duck them */
const duckGain = ctx.createGain();
duckGain.gain.value=1;
chordBus.connect(duckGain);
noiseBus.connect(duckGain);
duckGain.connect(drive);

/*-----------------------------------------------------------------
SECTION 3 –  FX SENDS  (delay → reverb → master)
-----------------------------------------------------------------*/
/* Send gains (so we can control mix easily) */
const sendDelay  = ctx.createGain(); sendDelay.gain.value=1;
const sendReverb = ctx.createGain(); // mix set later by slider
/* Tape-style delay */
const delay = ctx.createDelay(1.2);
delay.delayTime.value = .3;     /* default 300 ms */
/* feedback path with darkening LPF */
const fbGain = ctx.createGain(); fbGain.gain.value=.4;
const fbLPF  = ctx.createBiquadFilter(); fbLPF.type='lowpass'; fbLPF.frequency.value=1500;
delay.connect(fbGain).connect(fbLPF).connect(delay);
/* Spring-ish convolution reverb – impulse generated programmatically */
const reverb = ctx.createConvolver();
(function makeImpulse(){
    const len = ctx.sampleRate*2.5;
    const ir  = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){
        const d = ir.getChannelData(ch);
        for(let i=0;i<len;i++){
            /* exponential decay noise ⇒ springy sound */
            d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
        }
    }
    reverb.buffer = ir;
})();
sendDelay.connect(delay);
delay.connect(reverb);        /* echoes feed reverb (classic dub) */
sendReverb.connect(reverb);   /* direct send path */
reverb.connect(drive);        /* reverb → drive → limiter */

/*-----------------------------------------------------------------
SECTION 4 –  PAD SYNTH / SAMPLE ENGINES
-----------------------------------------------------------------*/
/** Drum machine samples (808/909 etc.) packed as tiny Base64 data-URIs
    to keep the demo fully standalone.  Larger real kits should be
    fetched async – here we craft a few procedural hits for brevity. */
const Drum = {
    kick(t=ctx.currentTime){
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(120,t);
        o.frequency.exponentialRampToValueAtTime(45,t+.35);
        g.gain.setValueAtTime(1,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+.35);
        o.connect(g).connect(drumBus).connect(sendDelay);
        o.start(t); o.stop(t+.36);
        /* side-chain duck */
        if(duckAmt>0){
            const now=t;
            duckGain.gain.cancelScheduledValues(now);
            duckGain.gain.setTargetAtTime(1-duckAmt, now, 0.01);
            duckGain.gain.setTargetAtTime(1,           now+.02, .25);
        }
    },
    snare(t=ctx.currentTime){
        /* noise */
        const buf = ctx.createBuffer(1,ctx.sampleRate*.25,ctx.sampleRate);
        const d   = buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
        const n   = ctx.createBufferSource(); n.buffer=buf;
        const bp  = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800;
        const g   = ctx.createGain();
        g.gain.setValueAtTime(.8,t);
        g.gain.exponentialRampToValueAtTime(.001,t+.25);
        n.connect(bp).connect(g).connect(drumBus).connect(sendDelay);
        n.start(t); n.stop(t+.26);
    },
    clhat(open=false,t=ctx.currentTime){
        /* metallic hi-hat noise via six detuned square oscillators */
        const gain = ctx.createGain(); gain.gain.value=.4;
        const band = ctx.createBiquadFilter(); band.type='bandpass'; band.frequency.value=8200;
        gain.connect(band).connect(drumBus).connect(sendDelay);
        for(let i=0;i<6;i++){
            const o=ctx.createOscillator();
            o.type='square';
            o.frequency.value=140*(i+1)+Math.random()*30;
            o.connect(gain);
            o.start(t);
            o.stop(t+(open?.25:.05));
        }
        /* quick decay */
        gain.gain.setValueAtTime(.6,t);
        gain.gain.exponentialRampToValueAtTime(.001,t+(open?.25:.05));
    },
    clap(t=ctx.currentTime){ SnareLikeBurst(t,.15,5); },
    ride(t=ctx.currentTime){
        Drum.clhat(true,t);   /* simple stand-in – long open hat */
    },
    tom(f=180,t=ctx.currentTime){
        const o=ctx.createOscillator(); o.type='sine';
        const g=ctx.createGain();
        o.frequency.setValueAtTime(f,t);
        o.frequency.exponentialRampToValueAtTime(f*.7,t+.35);
        g.gain.setValueAtTime(1,t);
        g.gain.exponentialRampToValueAtTime(.0001,t+.35);
        o.connect(g).connect(drumBus).connect(sendDelay);
        o.start(t); o.stop(t+.36);
    }
};
/** helper: generate a quick clap/snap burst */
function SnareLikeBurst(t,len,bursts){
    for(let i=0;i<bursts;i++) Drum.snare(t+i*0.012);
}

/*──── CHORD SYNTH (detuned saw triad) ────*/
const chordFilter = ctx.createBiquadFilter();
chordFilter.type='lowpass'; chordFilter.frequency.value=1400; chordFilter.Q.value=.7;
chordFilter.connect(chordBus).connect(sendDelay).connect(sendReverb);
function playChord(variant=0,t=ctx.currentTime){
    /* minor triad offsets: 0, +3, +7 semis */
    const root = 220;                 /* A3 default */
    const detune = variant?7:0;       /* 2nd chord up a 5th for flavour */
    const freqs = [root,root*Math.pow(2,3/12),root*1.5]
                  .map(f=>f*Math.pow(2,detune/12));
    const env   = ctx.createGain();   /* amp envelope */
    env.gain.setValueAtTime(0,t);
    env.gain.linearRampToValueAtTime(.9,t+.01);
    env.gain.exponentialRampToValueAtTime(.001,t+1.3);
    env.connect(chordFilter);
    freqs.forEach(f=>{
        const o=ctx.createOscillator();
        o.type='sawtooth'; o.frequency.value=f;
        o.detune.value=(Math.random()*2-1)*4;   /* subtle analog drift */
        o.connect(env);
        o.start(t); o.stop(t+1.4);
    });
}

/*──── SUB-BASS (808 style sine drop) ────*/
function playBass(t=ctx.currentTime){
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=55;
    const g=ctx.createGain(); g.gain.value=.9;
    /* quick pitch ENV for click */
    o.frequency.setValueAtTime(70,t);
    o.frequency.exponentialRampToValueAtTime(55,t+.08);
    /* volume env */
    g.gain.setValueAtTime(1,t);
    g.gain.exponentialRampToValueAtTime(.001,t+1.2);
    o.connect(g).connect(bassBus);
    o.start(t); o.stop(t+1.25);
}

/*──── VINYL NOISE LOOP (toggle) ────*/
let noiseLoop = null;
function triggerNoise(){
    if(noiseLoop){
        noiseLoop.stop(); noiseLoop=null;
        return;
    }
    const len=ctx.sampleRate*2;
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=ctx.createBufferSource();
    src.buffer=buf; src.loop=true;
    src.connect(noiseBus).connect(sendDelay).connect(sendReverb);
    src.start();
    noiseLoop=src;
}

/*-----------------------------------------------------------------
SECTION 5 –  CUSTOM SAMPLES  (pads can be remapped)
-----------------------------------------------------------------*/
const customSamples = {};  // map padName → playback function
let armedPad = null;
$('#padGrid').addEventListener('contextmenu',e=>{
    const pad=e.target.closest('.pad'); if(!pad) return;
    e.preventDefault();
    if(pad.id==="deckPad"){armedPad=null; return;} /* deck handled separately */
    armedPad=pad;
    [...$('#padGrid').children].forEach(p=>p.classList.remove('armed'));
    pad.classList.add('armed');
});
$('#btnSample').onclick=()=>{
    if(!armedPad) return alert('Right-click a pad first.');
    $('#fileInput').click();
};
$('#fileInput').onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    const buf=await file.arrayBuffer();
    const audio=await ctx.decodeAudioData(buf);
    const fn = t=>{
        const s=ctx.createBufferSource(); s.buffer=audio;
        s.connect(percussionRoute(s.duration)).start(t);
    };
    if(armedPad){
        customSamples[armedPad.dataset.sound]=fn;
        armedPad.querySelector('span').textContent='Sample';
        armedPad.classList.remove('armed'); armedPad=null;
    }else{ /* deck pad */
        customSamples['deck']=fn;
        $('#deckPad').disabled=false;
    }
};
/* simple router: percussion samples go to percBus etc. */
function percussionRoute(len){
    const g=ctx.createGain();
    g.connect(percBus).connect(sendDelay).connect(sendReverb);
    /* small decay on gain to avoid leftover DC after sample tail */
    g.gain.setValueAtTime(1,ctx.currentTime);
    g.gain.setTargetAtTime(.0001,ctx.currentTime+len,.5);
    return g;
}

/*-----------------------------------------------------------------
SECTION 6 –  PAD INTERACTION
-----------------------------------------------------------------*/
$('#padGrid').addEventListener('pointerover',e=>{
    const pad=e.target.closest('.pad'); if(!pad) return;
    triggerPad(pad);
});
function triggerPad(pad){
    const type=pad.dataset.sound;
    pad.classList.add('active');
    setTimeout(()=>pad.classList.remove('active'),100);

    /* choose action */
    const now=ctx.currentTime+.01;
    if(customSamples[type]){ customSamples[type](now); }
    else switch(type){
        /* drums */
        case'kick':  Drum.kick(now); break;
        case'snare': Drum.snare(now); break;
        case'clhat': Drum.clhat(false,now); break;
        case'ophat': Drum.clhat(true ,now); break;
        case'clap':  Drum.clap(now); break;
        case'ride':  Drum.ride(now); break;
        case'perc1': Drum.snare(now); break; /* placeholder fx */
        case'perc2': Drum.clhat(false,now); break;
        case'tomL':  Drum.tom(130,now); break;
        case'tomM':  Drum.tom(180,now); break;
        case'tomH':  Drum.tom(260,now); break;
        /* melodic */
        case'chord1':playChord(0,now); break;
        case'chord2':playChord(1,now); break;
        case'bass':  playBass(now); break;
        case'noise': triggerNoise(); break;
        case'deck':  if(customSamples.deck) customSamples.deck(now); break;
    }
    if(isRecording) recordHit(type);
}

/*-----------------------------------------------------------------
SECTION 7 –  TRANSPORT / LOOP RECORDER
-----------------------------------------------------------------*/
let tempo=120, PPQ=4, barLen=4;
let isPlaying=false, isRec=false;
let startTime=0, nextSched=0, schedTimer=null;
const layers=[]; let take=[];      /* recorded events */
function startTransport(){
    if(ctx.state==='suspended') ctx.resume();
    startTime=ctx.currentTime+.05;
    nextSched=startTime;
    isPlaying=true;
    schedTimer=setInterval(scheduler,25);
}
function stopTransport(){
    isPlaying=false;
    clearInterval(schedTimer);
}
function scheduler(){
    const stepDur=60/tempo/PPQ;
    while(nextSched<ctx.currentTime+.1){
        const stepIdx=Math.round((nextSched-startTime)/stepDur);
        layers.forEach(arr=>{
            arr.filter(ev=>ev.step% (barLen*PPQ)===stepIdx%(barLen*PPQ))
               .forEach(ev=>triggerPadInstant(ev.type,nextSched));
        });
        nextSched+=stepDur;
    }
}
/* instantaneous pad trigger w/out animation (for playback) */
function triggerPadInstant(type,at){
    if(customSamples[type]) customSamples[type](at);
    else{
        switch(type){
            case'kick':Drum.kick(at); break;
            case'snare':Drum.snare(at); break;
            case'clhat':Drum.clhat(false,at); break;
            case'ophat':Drum.clhat(true,at); break;
            case'clap':Drum.clap(at); break;
            case'ride':Drum.ride(at); break;
            case'perc1':Drum.snare(at); break;
            case'perc2':Drum.clhat(false,at); break;
            case'tomL':Drum.tom(130,at); break;
            case'tomM':Drum.tom(180,at); break;
            case'tomH':Drum.tom(260,at); break;
            case'chord1':playChord(0,at); break;
            case'chord2':playChord(1,at); break;
            case'bass':playBass(at); break;
            case'noise': if(!noiseLoop) triggerNoise(); break;
            case'deck': if(customSamples.deck) customSamples.deck(at); break;
        }
    }
}
function recordHit(type){
    const stepDur=60/tempo/PPQ;
    const step=Math.round((ctx.currentTime-startTime)/stepDur);
    take.push({step,type});
}
function startRec(){ take=[]; isRec=true; $('#btnRecord').textContent='⏸️ Rec';
    if(!isPlaying) startTransport(); }
function stopRec(){
    isRec=false; $('#btnRecord').textContent='● Record';
    if(take.length) layers.push(take);
}
$('#btnPlay').onclick = ()=>{ if(!isPlaying) startTransport(); };
$('#btnStop').onclick = stopTransport;
$('#btnRecord').onclick=()=> isRec?stopRec():startRec();
$('#btnOverdub').onclick=()=>{ if(!isPlaying) startTransport(); isRec=true; $('#btnRecord').textContent='⏸️ Rec'; };
$('#btnClear').onclick = ()=>layers.length=0;

/*-----------------------------------------------------------------
SECTION 8 –  UI CONTROLS
-----------------------------------------------------------------*/
$('#tempo').oninput=e=>{
    tempo=+e.target.value; $('#tempoVal').textContent=tempo;
};
$('#delayTime').oninput=e=>{
    const v = +e.target.value; $('#dTimeVal').textContent=v;
    delay.delayTime.value=v/1000;
};
$('#feedback').oninput=e=>{
    const v=+e.target.value; $('#fbVal').textContent=v.toFixed(2);
    fbGain.gain.value=v;
};
$('#reverbMix').oninput=e=>{
    const v=+e.target.value; $('#revVal').textContent=v.toFixed(2);
    sendReverb.gain.value=v;
};
$('#cutoff').oninput=e=>{
    const v=+e.target.value; $('#cutVal').textContent=v;
    chordFilter.frequency.value=v;
};
let duckAmt=.6;
$('#duckAmt').oninput=e=>{
    duckAmt=+e.target.value; $('#duckVal').textContent=duckAmt.toFixed(2);
};
/* drive knob uses custom CSS – update curve & visual */
$('#driveKnob').oninput=e=>{
    const v=+e.target.value;
    drive.curve = makeSaturationCurve(v);
    /* visual fill */
    e.target.style.setProperty('--val',Math.round(v*100));
};

/*-----------------------------------------------------------------
SECTION 9 –  UNLOCK AUDIO CONTEXT ON FIRST TOUCH
-----------------------------------------------------------------*/
window.addEventListener('pointerdown',()=>{ if(ctx.state==='suspended') ctx.resume(); },{once:true});

/*-----------------------------------------------------------------
END OF FILE
-----------------------------------------------------------------*/
</script>
</body>
